<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1B1B1B" />
    <meta name="color-scheme" content="dark light" />
    <!-- iOS 홈 화면(PWA)에서 상단 상태바를 투명하게 처리해 배경색(#1B1B1B)이 그대로 비치도록 한다. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="cache" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>cache</title>
    <script>
      // 첫 페인트 전에 시스템 테마를 반영해 깜빡임을 막는다.
      (function () {
        var dark = matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#1B1B1B" : "#F5F5F7");
      })();
      // iOS 사파리·PWA는 로드 직후 실제 화면 높이가 한 박자 늦게 확정될 때가 있어, 그 사이
      // 100dvh만 믿으면 스크롤할 내용이 없는데도 몇 px가 스크롤되는 문제가 생긴다.
      // window.innerHeight를 직접 읽어 --vh로 저장해 두고, 툴바 표시 상태가 바뀔 때마다
      // (resize/visualViewport resize 등) 다시 계산한다. CSS는 100dvh 대신 이 값을 쓴다.
      (function () {
        var setVh = function () {
          document.documentElement.style.setProperty("--vh", window.innerHeight + "px");
        };
        setVh();
        window.addEventListener("resize", setVh);
        window.addEventListener("orientationchange", setVh);
        window.addEventListener("pageshow", setVh);
        if (window.visualViewport) window.visualViewport.addEventListener("resize", setVh);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
